name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android licenses & install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # Prefer cmdline tools from image; install if missing via sdkmanager path
          if ! command -v sdkmanager >/dev/null 2>&1; then
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            export ANDROID_HOME="$HOME/android-sdk"
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          else
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" || true
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-$HOME/android-sdk}" >> $GITHUB_ENV

      - name: local.properties
        run: |
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          echo "sdk.dir=$SDK" > local.properties
          echo "ndk.dir=$SDK/ndk/26.1.10909125" >> local.properties
          cat local.properties

      - name: Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.2.1
            else
              curl -sL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o /tmp/g.zip
              unzip -q /tmp/g.zip -d /tmp
              /tmp/gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
            fi
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: xena-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
