name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve APK release version
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid app versionName: $VERSION_NAME" >&2
            exit 1
          fi
          TAG="v$VERSION_NAME"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; build will be validated without replacing a published APK."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run model, UI, updater, and release checks
        run: node --test tests/model-download-release.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2.1"

      - name: Install Android SDK (cmdline-tools)
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          rm -rf "$SDK/cmdline-tools/latest"
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_HOME=$SDK
          export PATH=$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "PATH=$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties

      - name: Load stable APK signing key
        id: signing
        env:
          XENA_SIGNING_KEYSTORE_BASE64: ${{ secrets.XENA_SIGNING_KEYSTORE_BASE64 }}
          XENA_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.XENA_SIGNING_KEYSTORE_PASSWORD }}
        run: |
          test -n "$XENA_SIGNING_KEYSTORE_BASE64"
          test -n "$XENA_SIGNING_KEYSTORE_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/xena-release.jks"
          printf '%s' "$XENA_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "keystore_path=$KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          XENA_SIGNING_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          XENA_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.XENA_SIGNING_KEYSTORE_PASSWORD }}
          XENA_SIGNING_KEY_ALIAS: xena-release
          XENA_SIGNING_KEY_PASSWORD: ${{ secrets.XENA_SIGNING_KEY_PASSWORD || secrets.XENA_SIGNING_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK and native ARM64 llama.cpp engine
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libllama.so'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"

      - name: Compare signing certificate and prepare release notes
        id: signer
        if: github.ref == 'refs/heads/main' && steps.release_meta.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          CURRENT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test -n "$CURRENT"
          printf '%s\n' "## Xena-AI v${{ steps.release_meta.outputs.version }}" > release-notes.md
          PREVIOUS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          COMPATIBLE=true
          if [[ -n "$PREVIOUS" ]]; then
            mkdir -p /tmp/xena-previous-release
            if gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern 'app-*.apk' --dir /tmp/xena-previous-release >/dev/null 2>&1; then
              OLD_APK=$(find /tmp/xena-previous-release -maxdepth 1 -type f -name '*.apk' -print -quit)
              if [[ -z "$OLD_APK" ]]; then
                COMPATIBLE=false
              else
                OLD=$($APKSIGNER verify --print-certs "$OLD_APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n 1)
                if [[ -z "$OLD" || "$OLD" != "$CURRENT" ]]; then COMPATIBLE=false; fi
              fi
            else
              COMPATIBLE=false
            fi
          fi
          echo "compatible=$COMPATIBLE" >> "$GITHUB_OUTPUT"
          if [[ "$COMPATIBLE" == "true" ]]; then
            printf '\n- APK signed with the same stable signing certificate as the previous release.\n' >> release-notes.md
          else
            printf '\n### One-time signing-key migration\n\nEarlier Xena APK releases used different debug signing certificates. Android cannot update those installations in place to this stable signed release. Export or back up important local data, uninstall the older app, then install this APK. After this migration, future APK updates from the same stable signing key can be installed normally.\n' >> release-notes.md
            echo "::warning::Signing certificate changed; earlier installs require a one-time reinstall."
          fi
          cat >> release-notes.md <<'NOTES'

          - Model catalog: Qwen2.5-Coder 1.5B Q4_K_M, 3B Q3_K_M, 7B Q2_K, Q3_K_M, and Q4_K_M.
          - Adds WhiteRabbitNeo V3 7B Q2_K as an additional local GGUF model; existing Qwen models and Groq Server Mode remain available.
          - Explicit continue, pause, and verify controls; resumable HTTP Range downloads preserve partial files if the server rejects resume.
          - Search installed/partial model files by name and storage path; GGUF details show file metadata instead of treating binary weights as source code.
          - Startup prepares/migrates models without loading them unless auto-load was enabled; preflight RAM checks prevent likely low-memory process kills.
          - GGUF validation and safe import/move into Android app-specific storage.
          - Conservative 6 GB RAM defaults: context 1024, batch 32, 2 threads; lower-memory load fallbacks.
          - Server Mode migrates from Hugging Face Inference to Groq Chat Completions using the currently listed production model `openai/gpt-oss-20b`.
          - Groq API key is entered in the app and encrypted with Android Keystore; no API key is included in source or APK.
          - Chat corner menu adds a shortcut to Model AI and shows the active model.
          - RAM cleanup unloads the local model and clears reclaimable WebView cache; residual cleanup removes failed partial downloads and invalid GGUF files without deleting the active model.
          - The Model tab includes animated cleanup controls for RAM, residual downloads, and both together.
          - Legacy Hugging Face inference credentials and Space URL are cleared. Hugging Face remains only as a source for public local GGUF model files.
          - Existing Chat, navigation, connectors, themes, and settings remain in the app.
          - `libllama.so` is built from the pinned llama.cpp source for arm64-v8a; GGUF model weights are downloaded separately in the app.
          - In-app APK updater checks the latest GitHub Release, selects `app-release.apk`, verifies its signing certificate, and opens the Android installer; Android confirmation is still required.
          - Update flow resumes after the user enables Android's "Install unknown apps" permission, and stable signing keeps future updates compatible without deleting local data or models.
          - Current UI is the four-tab full-screen interface: Chat, Model, Konektor, and Atur, with dark/light/hacker/cyberpunk themes and the current model manager controls.
          - Documentation is synchronized in `README.md`, `docs/SISTEM_TERKINI.md`, and `docs/CATATAN_UI_V1.2_RELEASE.md`.

          ### Install
          Download `app-release.apk` and install on the Android device. Android may ask once to allow installation from this source.
          NOTES

      - uses: actions/upload-artifact@v4
        with:
          name: xena-ai-release-apk-v${{ steps.release_meta.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && steps.release_meta.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Xena-AI v${{ steps.release_meta.outputs.version }}
          body_path: release-notes.md
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
