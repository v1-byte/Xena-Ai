name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2.1"

      - name: Install Android SDK (cmdline-tools)
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          rm -rf "$SDK/cmdline-tools/latest"
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_HOME=$SDK
          export PATH=$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "PATH=$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH" >> $GITHUB_ENV

      - name: local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties
          cat local.properties

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: xena-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: Xena-AI v1.2.3
          body: |
            ## Xena-AI v1.2.3 — real llama.cpp JNI

            - UI v1.2 full-screen (Chat / Model / Konektor / Atur)
            - Bridge `Android.chat`, `loadModel`, `stop`, `storageInfo`
            - Connectors (token lokal)
            - JNI `libllama.so` built from llama.cpp (CPU arm64) (ganti dengan llama.cpp asli untuk inference penuh)

            ### Install
            Unduh `app-debug.apk`, install di HP (izinkan sumber tidak dikenal).

            ### Model
            Letakkan `qwen2.5-coder-7b-instruct-q3_k_m.gguf` di Download atau folder app.

            ### Catatan
            Stub native tidak menjalankan GGUF — untuk chat lokal penuh, bangun `libllama.so` asli.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
